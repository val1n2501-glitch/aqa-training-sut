[project]
name = "aqa-training-sut"
version = "1.0.0"
description = "Учебный Task Manager — приложение под тестирование"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi==0.141.1",
    "pydantic==2.11.9",
    "sqlalchemy==2.0.43",
    "uvicorn==0.35.0",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-playwright==0.7.1",
    "playwright==1.55.0",
    "ruff==0.13.0",
    "httpx2==2.13.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = ["api: minimal API smoke", "ui: minimal UI smoke"]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
